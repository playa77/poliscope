[project]
name = "poliscope-engine"
version = "0.1.0"
description = "Poliscope managed runtime scaffold"
requires-python = "==3.12.*"
dependencies = [
    "orjson==3.11.3",
    "pydantic==2.12.5",
]

[dependency-groups]
dev = ["pytest==9.0.2", "pyinstaller==6.19.0"]

[tool.uv]
required-version = "==0.12.23"
package = true

[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["engine/poliscope_engine"]

[tool.pytest.ini_options]
testpaths = ["tests/engine", "tests/roadmap", "tests/harness"]
xfail_strict = true
